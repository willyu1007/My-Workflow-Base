name: Workflow contract conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Typecheck and test templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Templates declare their own pnpm versions. Keep Corepack's per-project
      # selection rather than putting one fixed pnpm binary ahead of its shims.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate dependency store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache root and standalone workbench dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-node24-${{ hashFiles('pnpm-lock.yaml', 'templates/web-workbench/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-node24-

      - name: Verify repository governance
        run: node .ai/scripts/ctl-project-governance.mjs lint --strict

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The kit has its own lockfile and is NOT in pnpm-workspace.yaml, but it
      # sits inside the workspace root — so a plain `pnpm install` here resolves
      # against the ROOT lockfile and ignores the kit's own. --ignore-workspace
      # is what makes this install the one the committed lockfile describes.
      - name: Install the UI kit dependencies
        working-directory: templates/web-workbench
        run: |
          pnpm install --ignore-workspace --frozen-lockfile

      - name: Verify core behavior and production artifacts
        run: pnpm verify:workflow-contracts
