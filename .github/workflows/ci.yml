name: Workflow contract conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-contract-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Typecheck and test templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workflow contract conformance
        run: pnpm verify:workflow-contracts

      # The UI kit is not a workspace member (own lockfile, published
      # separately), but this check needs no dependencies — it reads two files.
      - name: Verify UI kit tokens are generated from their source
        run: pnpm check:ui-tokens

      # The kit has its own lockfile and is NOT in pnpm-workspace.yaml, but it
      # sits inside the workspace root — so a plain `pnpm install` here resolves
      # against the ROOT lockfile and ignores the kit's own. --ignore-workspace
      # is what makes this install the one the committed lockfile describes.
      - name: Test the UI kit
        working-directory: templates/web-workbench
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm test
